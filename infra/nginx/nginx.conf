events { worker_connections 256; }

http {
    # Port 80 — CartBreach storefront + payment webhook
    server {
        listen 80;
        server_name cartbreach.local _;

        # Payment webhook
        location /api/v1/payment/ {
            proxy_pass         http://payment-gw:5000;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        # Everything else → storefront
        location / {
            proxy_pass         http://storefront-web:3000;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }
    }

    # Participant challenge portal
    server {
        listen 80;
        server_name portal.cartbreach.local;

        # In-browser Web Terminal for Stage 05 & 06 container exploitation
        location /terminal/ {
            proxy_pass         http://order-inventory-api:7681;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400;
        }

        location = /terminal {
            return 301 /terminal/;
        }

        location / {
            proxy_pass         http://participant-portal:80;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }
    }

    # Admin operations dashboard
    server {
        listen 80;
        server_name admin.cartbreach.local;

        location / {
            proxy_pass         http://admin-dashboard:80;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }
    }

    # Port 8080 — Gitea staging repo mirror
    server {
        listen 8080;
        server_name git.cartbreach.local _;

        location / {
            proxy_pass         http://staging-repo:3001;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }
    }
}
