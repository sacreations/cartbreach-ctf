events { worker_connections 256; }

http {
    map $http_x_forwarded_proto $proxy_x_forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    map $http_x_forwarded_host $proxy_x_forwarded_host {
        default $http_x_forwarded_host;
        ''      $host;
    }

    # Participant challenge portal (portal.* or portal.cartbreach.local)
    server {
        listen 80;
        server_name ~^portal\..*$ portal.cartbreach.local;

        # In-browser Web Terminal for Stage 05 & 06 container exploitation
        location /terminal/ {
            proxy_pass         http://order-inventory-api:7681;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $proxy_x_forwarded_proto;
            proxy_set_header   X-Forwarded-Host $proxy_x_forwarded_host;
            proxy_read_timeout 86400;
        }

        location = /terminal {
            return 301 /terminal/;
        }

        location / {
            proxy_pass         http://participant-portal:80;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $proxy_x_forwarded_proto;
            proxy_set_header   X-Forwarded-Host  $proxy_x_forwarded_host;
        }
    }

    # Admin operations dashboard (admin.* or admin.cartbreach.local)
    server {
        listen 80;
        server_name ~^admin\..*$ admin.cartbreach.local;

        location / {
            proxy_pass         http://admin-dashboard:80;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $proxy_x_forwarded_proto;
            proxy_set_header   X-Forwarded-Host  $proxy_x_forwarded_host;
        }
    }

    # Git mirror on port 80 (for Cloudflare Tunnel routing git.* on standard HTTP/HTTPS)
    server {
        listen 80;
        server_name ~^git\..*$ git.cartbreach.local;

        location / {
            proxy_pass         http://staging-repo:3001;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $proxy_x_forwarded_proto;
            proxy_set_header   X-Forwarded-Host  $proxy_x_forwarded_host;
        }
    }

    # Internal Inventory API on port 80 (for Cloudflare Tunnel routing inventory.*)
    server {
        listen 80;
        server_name ~^inventory\..*$ inventory.cartbreach.local;

        location / {
            proxy_pass         http://order-inventory-api:8000;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $proxy_x_forwarded_proto;
            proxy_set_header   X-Forwarded-Host  $proxy_x_forwarded_host;
        }
    }

    # Port 80 — CartBreach storefront + payment webhook (store.* or default _)
    server {
        listen 80 default_server;
        server_name ~^(?:store|shop)\..*$ cartbreach.local _;

        # Payment webhook
        location /api/v1/payment/ {
            proxy_pass         http://payment-gw:5000;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $proxy_x_forwarded_proto;
            proxy_set_header   X-Forwarded-Host  $proxy_x_forwarded_host;
        }

        # Everything else → storefront
        location / {
            proxy_pass         http://storefront-web:3000;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $proxy_x_forwarded_proto;
            proxy_set_header   X-Forwarded-Host  $proxy_x_forwarded_host;
        }
    }

    # Port 8080 — Gitea staging repo mirror (local port access)
    server {
        listen 8080;
        server_name git.cartbreach.local _;

        location / {
            proxy_pass         http://staging-repo:3001;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $proxy_x_forwarded_proto;
            proxy_set_header   X-Forwarded-Host  $proxy_x_forwarded_host;
        }
    }
}
