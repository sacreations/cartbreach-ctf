networks:
  cartbreach-public:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.10.0/24
  cartbreach-backend:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.28.20.0/24

volumes:
  pgdata:

services:

  # 1. Edge Proxy & Entrypoint
  nginx-proxy:
    image: nginx:alpine
    container_name: cartbreach-nginx
    restart: on-failure:5
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - cartbreach-public
    depends_on:
      - storefront-web
      - payment-gw
      - staging-repo
      - platform-api
      - participant-portal
      - admin-dashboard
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  # 2. Gitea Stage Repo (Stage 1 — leaked git history)
  staging-repo:
    build: ./services/staging-repo
    container_name: cartbreach-staging-repo
    restart: on-failure:5
    networks:
      - cartbreach-public
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  # 3. Public Storefront (Stages 1+2)
  storefront-web:
    build: ./services/storefront
    container_name: cartbreach-storefront
    restart: on-failure:5
    environment:
      - NODE_ENV=production
      - DB_HOST=postgres-data
      - DB_PORT=5432
      - DB_NAME=cartbreach
      - DB_USER=cart_user
      - DB_PASS=cart_db_pass_2026!
      - INVENTORY_API=http://order-inventory-api:8000
      - STAGING_TOKEN=cb_staging_9a8f2c3d4e5f
    networks:
      - cartbreach-public
      - cartbreach-backend
    depends_on:
      - postgres-data
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  # 4. Payment Callback Gateway (Stage 3)
  payment-gw:
    build: ./services/payment-gw
    container_name: cartbreach-payment
    restart: on-failure:5
    environment:
      - FLASK_ENV=production
      - HMAC_KEY=checkout2024
      - INVENTORY_API=http://order-inventory-api:8000
    networks:
      - cartbreach-public
      - cartbreach-backend
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  # 5. Internal Inventory & Invoice API — exploitable host (Stages 4+5+6)
  order-inventory-api:
    build: ./services/inventory-api
    container_name: cartbreach-inventory
    restart: on-failure:5
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=postgres-data
      - DB_PORT=5432
      - DB_NAME=cartbreach
      - DB_USER=cart_user
      - DB_PASS=cart_db_pass_2026!
      - INTERNAL_TOKEN=cb_internal_svc_t0k3n_4dm1n
    networks:
      - cartbreach-public
      - cartbreach-backend
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 384M

  # 6. Trusted platform API for participant/admin interfaces
  platform-api:
    build: ./services/platform-api
    container_name: cartbreach-platform-api
    restart: on-failure:5
    environment:
      - DATABASE_URL=postgresql://cart_user:cart_db_pass_2026!@postgres-data:5432/cartbreach
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-http://portal.cartbreach.local/api/v1/auth/google/callback}
    networks:
      - cartbreach-public
      - cartbreach-backend
    depends_on:
      - postgres-data
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 192M

  participant-portal:
    build: ./apps/participant-portal
    container_name: cartbreach-participant-portal
    restart: on-failure:5
    networks:
      - cartbreach-public
    depends_on:
      - platform-api
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  admin-dashboard:
    build: ./apps/admin-dashboard
    container_name: cartbreach-admin-dashboard
    restart: on-failure:5
    networks:
      - cartbreach-public
    depends_on:
      - platform-api
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  # 10. Database Backend
  postgres-data:
    image: postgres:16-alpine
    container_name: cartbreach-postgres
    restart: on-failure:5
    environment:
      - POSTGRES_DB=cartbreach
      - POSTGRES_USER=cart_user
      - POSTGRES_PASSWORD=cart_db_pass_2026!
    volumes:
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    networks:
      - cartbreach-backend
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
